name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/pyproject.toml

      - name: Install collector and dev dependencies
        run: pip install -e "./collector[dev]"

      - name: Syntax gate (py_compile)
        run: |
          find collector/src collector/tests -name '*.py' -print0 \
            | xargs -0 python -m py_compile

      - name: Import check (no phantom modules)
        run: python scripts/check_imports.py

      - name: Run test suite
        run: python -m pytest collector/tests -q
