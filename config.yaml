db_path: ./bloom.db
calendar_url: https://nfs.faireconomy.media/ff_calendar_thisweek.json
max_news: 15

cadences:          # seconds between fetcher runs
  equity: 300
  bonds: 3600
  macro: 3600      # job runs hourly; refresh decision logic inside (spec: 6h, hourly on release days)
  news: 600
  defi: 900
  midnight: 900
  refs: 900
  refs_history: 86400
  morpho: 900
  cycle: 86400   # daily; weekly sources just re-upsert (idempotent)
  insights: 1800
  ofr: 86400        # OFR Hedge Fund Monitor; daily max per OFR guidance (series are quarterly)
  cftc_pos: 604800  # CFTC TFF/CIT/disaggregated positioning; weekly (Tuesdays)
  tic: 604800       # TIC major foreign holders; monthly release
  thirteenf: 604800 # SEC 13F-HR watchlist; quarterly filings, weekly poll
  auctions: 86400   # Treasury auction surveillance; daily (each run pages ~18 months)
  dealer: 604800    # NY Fed primary dealer stats; weekly (released Wednesdays)
  risk: 86400       # risk/prediction engine; daily compute job (no external HTTP)
  country_risk: 86400 # world risk map scoring; daily compute job (no external HTTP)
  gse: 2592000      # Fannie/Freddie monthly volume summaries; ~25d release lag, job probes 4 month-ends
  xcorr: 86400      # correlation + realized-vol compute job; daily (no external HTTP)
  movers: 604800    # single-stock sigma movers; ~600 Yahoo requests, weekly Saturday
  voldash: 86400    # vol dashboard compute; daily (no external HTTP)
  home_radar: 86400 # market radar compute; daily (no external HTTP)
  hyperscaler: 604800 # hyperscaler desk; weekly (6 SEC submissions + 424B2 fetches)

  ai_capex: 604800   # AI buildout universe XBRL capex/financials; weekly (quarterly data)
  ai_graph: 604800   # AI money-flow knowledge graph; weekly (zero HTTP, overlays ai_capex)
  trace_treasury: 86400  # FINRA Treasury TRACE aggregates; daily file ~8pm ET
  trace_monthly: 86400 # FINRA TRACE monthly volume; daily probe (no-op when current), fast-fail while CDN blocked
  ice_star: 86400        # ICE Vantage daily STAR zip (agency/non-agency securitized)
  finra_short: 604800    # FINRA short interest 2x/month; weekly poll
  finra_margin: 2592000  # FINRA margin stats; single file, full history to 1997
  finra_breadth: 86400   # FINRA bond breadth + sentiment (dynarep API); daily, history to 2018
  finra_corp: 86400      # FINRA most-active corp bonds (dynarep API); daily, history to 2023
  finra_regsho: 86400    # FINRA Reg SHO daily short volume + OTC threshold list; daily, keyless
  finra_capped: 2592000  # FINRA capped volume report (corp/agency); monthly keyless CSV, 12 rolling months
  finra_ids_star: 86400  # FINRA IDS STAR Structured Product Activity Reports; daily ZIPs, keyless, 36-mo backfill
  finra_factbook: 2592000  # FINRA TRACE Fact Book quarterly workbooks (corp/agency/sec XLSX); monthly poll, quarterly release
  finra_factbook_annual: 31536000  # FINRA Fact Book annual Transaction/Issue/Participant workbooks; yearly poll, annual release
  ms_capex: 604800       # market-structure universe XBRL financials; weekly (quarterly data)
  ms_graph: 604800       # market-structure money-flow graph; weekly (zero HTTP, overlays ms_capex)
  tsv_capex: 604800      # tokenized-securities universe XBRL fundamentals; weekly
  tsv_graph: 604800      # tokenized-securities money-flow graph; weekly (zero HTTP)
  tsv_watch: 604800      # TSV regulatory scan (SEC press + Federal Register); weekly
  bank_capex: 604800     # bank/fixed-income universe XBRL fundamentals; weekly (quarterly data)
  bank_graph: 604800     # bank/fixed-income money-flow graph; weekly (zero HTTP, overlays bank_capex)
  bank_capex: 604800     # bank/fixed-income universe XBRL fundamentals; weekly (quarterly data)
  bank_graph: 604800     # bank/fixed-income money-flow graph; weekly (zero HTTP, overlays bank_capex)
  tech_capex: 604800     # technology universe XBRL fundamentals; weekly (quarterly data)
  tech_graph: 604800     # technology money-flow graph; weekly (zero HTTP, overlays tech_capex)
  vendor_capex: 604800   # vendor universe XBRL fundamentals; weekly (quarterly data)
  vendor_graph: 604800   # vendor money-flow graph; weekly (zero HTTP, overlays vendor_capex)
  etf_capex: 604800      # ETF ecosystem universe XBRL fundamentals; weekly (quarterly data)
  etf_graph: 604800      # ETF money-flow graph; weekly (zero HTTP, overlays etf_capex)
  crypto_capex: 604800   # crypto universe XBRL fundamentals; weekly (quarterly data)
  crypto_graph: 604800   # crypto money-flow graph; weekly (zero HTTP, overlays crypto_capex)
  worldbank: 604800    # World Bank macro fundamentals; weekly (annual data)
  usaspending: 604800  # USAspending.gov fiscal pulse; weekly (3 keyless POSTs)
  coingecko: 86400     # CoinGecko top-50 crypto breadth; daily (1 batched call)
  openfigi: 604800     # OpenFIGI symbology map; weekly (skips w/o OPENFIGI_API_KEY)
  finnhub: 86400       # Finnhub earnings+insider; daily when FINNHUB_API_KEY set
  polymarket: 1800    # Polymarket Gamma top markets by 24h volume; keyless, 1 batched call
  kalshi: 1800        # Kalshi Trade API v2 open markets; keyless, 1-5 batched calls
  pred_edge: 3600     # prediction-market edge engine; hourly compute + bounded resolution checks
indexes:           # all served by yahoo
  - { symbol: SPX,  name: "S&P 500",       yahoo: "^GSPC" }
  - { symbol: NDX,  name: "Nasdaq 100",    yahoo: "^NDX" }   # validate-in-smoke
  - { symbol: DJI,  name: "Dow Jones",     yahoo: "^DJI" }
  - { symbol: SX5E, name: "Euro Stoxx 50", yahoo: "^STOXX50E" }   # validate-in-smoke
  - { symbol: DAX,  name: "DAX",           yahoo: "^GDAXI" }
  - { symbol: CAC,  name: "CAC 40",        yahoo: "^FCHI" }
  - { symbol: UKX,  name: "FTSE 100",      yahoo: "^FTSE" }   # validate-in-smoke
  - { symbol: SMI,  name: "SMI",           yahoo: "^SSMI" }   # validate-in-smoke
  - { symbol: NKX,  name: "Nikkei 225",    yahoo: "^N225" }
  - { symbol: HSI,  name: "Hang Seng",     yahoo: "^HSI" }   # validate-in-smoke

bonds:
  - { country: US, tenor: 10Y, fred: DGS10 }
  - { country: US, tenor: 3M,  fred: DGS3MO }
  - { country: DE, tenor: 10Y, bundesbank: "D.I.ZST.ZI.EUR.S1311.B.A604.R10XX.R.A.A._Z._Z.A" }
  - { country: DE, tenor: 3M,  ecb: "YC.B.U2.EUR.4F.G_N_A.SV_C_YM.SR_3M" }  # euro-area AAA curve; ≈ Bunds at the short end
  # G10 + euro majors via FRED OECD MEI harmonized 10Y (monthly). Verified IDs:
  # FR/GB/JP/DE/IT confirmed against FRED; CA/AU/CH/SE/ES/NL/BE follow the same
  # IRLTLT01{CC}M156N pattern. Monthly freq: levels populate, but 1d/1w bp
  # changes will read null for these rows (panels degrade gracefully).
  # UK via FRED monthly is fine — the repo's UK exclusion was specifically about
  # scraping the BoE IADB daily CSV (robots.txt), not about FRED.
  - { country: FR, tenor: 10Y, fred: IRLTLT01FRM156N }
  - { country: IT, tenor: 10Y, fred: IRLTLT01ITM156N }
  - { country: ES, tenor: 10Y, fred: IRLTLT01ESM156N }
  - { country: NL, tenor: 10Y, fred: IRLTLT01NLM156N }
  - { country: BE, tenor: 10Y, fred: IRLTLT01BEM156N }
  - { country: UK, tenor: 10Y, fred: IRLTLT01GBM156N }
  - { country: JP, tenor: 10Y, fred: IRLTLT01JPM156N }
  - { country: CA, tenor: 10Y, fred: IRLTLT01CAM156N }
  - { country: AU, tenor: 10Y, fred: IRLTLT01AUM156N }
  - { country: CH, tenor: 10Y, fred: IRLTLT01CHM156N }
  - { country: SE, tenor: 10Y, fred: IRLTLT01SEM156N }

cb_rates:          # policy rates for the WORLD BONDS matrix; country must match a bonds row
  - { country: US, label: FED, fred: DFEDTARU }
  - { country: DE, label: ECB, fred: ECBDFR }
  - { country: FR, label: ECB, fred: ECBDFR }
  - { country: IT, label: ECB, fred: ECBDFR }
  - { country: ES, label: ECB, fred: ECBDFR }
  - { country: NL, label: ECB, fred: ECBDFR }
  - { country: BE, label: ECB, fred: ECBDFR }
  # No UK/JP/CA/AU/CH/SE policy-rate rows: no verified keyless daily FRED series
  # for BoE/BoJ/BoC/RBA/SNB/Riksbank policy rates; those cells stay null.

series:            # macro click-through charts; transform per changes.apply_transform
  - { id: us-cpi-yoy,       name: "US CPI YoY %",            fred: CPIAUCSL,           unit: "%",   transform: yoy }
  - { id: us-core-cpi-yoy,  name: "US Core CPI YoY %",       fred: CPILFESL,           unit: "%",   transform: yoy }
  - { id: us-pce-yoy,       name: "US PCE YoY %",            fred: PCEPI,              unit: "%",   transform: yoy }
  - { id: us-nfp,           name: "US Non-Farm Payrolls Δk", fred: PAYEMS,             unit: "k",   transform: diff }
  - { id: us-unemployment,  name: "US Unemployment %",       fred: UNRATE,             unit: "%",   transform: none }
  - { id: us-gdp,           name: "US Real GDP QoQ SAAR %",  fred: A191RL1Q225SBEA,    unit: "%",   transform: none }
  - { id: us-retail,        name: "US Retail Sales MoM %",   fred: RSAFS,              unit: "%",   transform: pct_prev }
  - { id: us-fed-rate,      name: "Fed Funds Target Upper %",fred: DFEDTARU,           unit: "%",   transform: none }
  - { id: ez-hicp-yoy,      name: "EZ HICP YoY %",           fred: CP0000EZ19M086NEST, unit: "%",   transform: yoy }
  - { id: ez-unemployment,  name: "EZ Unemployment %",       fred: LRHUTTTTEZM156S,    unit: "%",   transform: none }
  - { id: ez-gdp,           name: "EZ Real GDP QoQ %",       fred: CLVMEURSCAB1GQEA19, unit: "%",   transform: pct_prev }
  - { id: ez-ecb-rate,      name: "ECB Deposit Rate %",      fred: ECBDFR,             unit: "%",   transform: none }

  # ---- extended FRED coverage (added 2026-10-03) ----
  - { id: us-housing-starts,        name: "US Housing Starts",                fred: HOUST,          unit: "k",   transform: none }
  - { id: us-building-permits,      name: "US Building Permits",              fred: PERMIT,         unit: "k",   transform: none }
  - { id: us-case-shiller-yoy,      name: "US Case-Shiller Home Prices YoY %",fred: CSUSHPINSA,     unit: "%",   transform: yoy }
  - { id: us-mortgage-30y,          name: "US 30Y Mortgage Rate %",           fred: MORTGAGE30US,   unit: "%",   transform: none }
  - { id: us-existing-home-sales,   name: "US Existing Home Sales",           fred: EXHOSLUSM495S,  unit: "k",   transform: none }
  - { id: us-avg-hourly-earnings-yoy, name: "US Avg Hourly Earnings YoY %",   fred: CES0500000003,  unit: "%",   transform: yoy }
  - { id: us-u6-unemployment,       name: "US U-6 Unemployment %",            fred: U6RATE,          unit: "%",   transform: none }
  - { id: us-prime-age-lfpr,        name: "US Prime-Age LFPR %",              fred: LNS11300060,     unit: "%",   transform: none }
  - { id: us-quits-rate,            name: "US Quits Rate %",                  fred: JTSQUR,          unit: "%",   transform: none }
  - { id: fed-total-assets,         name: "Fed Total Assets $m",              fred: WALCL,           unit: "$m",  transform: none }
  - { id: fed-reserve-balances,     name: "Fed Reserve Balances $m",          fred: WRESBAL,         unit: "$m",  transform: none }
  - { id: fed-on-rrp,               name: "Fed ON RRP $bn",                   fred: RRPONTSYD,       unit: "$bn", transform: none }
  - { id: us-federal-debt,          name: "US Federal Debt $m",               fred: GFDEBTN,         unit: "$m",  transform: none }
  - { id: us-federal-deficit,       name: "US Federal Budget Balance $m",     fred: FYFSD,           unit: "$m",  transform: none }
  - { id: wti-crude,                name: "WTI Crude $",                      fred: DCOILWTICO,      unit: "$",   transform: none }
  - { id: brent-crude,              name: "Brent Crude $",                    fred: DCOILBRENTEU,     unit: "$",   transform: none }
  - { id: eur-usd,                  name: "EUR/USD",                          fred: DEXUSEU,          unit: "fx",  transform: none }
  - { id: usd-jpy,                  name: "USD/JPY",                          fred: DEXJPUS,          unit: "fx",  transform: none }
  - { id: us-2y-yield,              name: "US 2Y Yield %",                    fred: DGS2,             unit: "%",   transform: none }
  - { id: us-3y-yield,              name: "US 3Y Yield %",                    fred: DGS3,             unit: "%",   transform: none }
  - { id: us-5y-yield,              name: "US 5Y Yield %",                    fred: DGS5,             unit: "%",   transform: none }
  - { id: us-7y-yield,              name: "US 7Y Yield %",                    fred: DGS7,             unit: "%",   transform: none }
  - { id: us-20y-yield,             name: "US 20Y Yield %",                   fred: DGS20,            unit: "%",   transform: none }
  - { id: us-30y-yield,             name: "US 30Y Yield %",                   fred: DGS30,            unit: "%",  transform: none }
  - { id: us-5y-breakeven,          name: "US 5Y Breakeven %",                fred: T5YIE,            unit: "%",  transform: none }
  - { id: us-umich-infl-exp,        name: "UMich 1Y Inflation Expectations %", fred: MICH,           unit: "%",   transform: none }

cycle_series:      # market-cycle series (spec 2026-08-24); exactly one source key each
  # ---- hidden infrastructure ----
  - { id: usrec,        name: "NBER Recession",            unit: idx,   fred: USREC, hidden: true }
  # ---- RISK ----
  - { id: vix,          name: "VIX",                       unit: idx,   fred: VIXCLS }
  - { id: vxn,          name: "VXN (Nasdaq vol)",          unit: idx,   fred: VXNCLS }
  - { id: pc-total,     name: "Put/Call total",            unit: ratio, cboe: "TOTAL PUT/CALL RATIO" }
  - { id: pc-equity,    name: "Put/Call equity",           unit: ratio, cboe: "EQUITY PUT/CALL RATIO" }
  - { id: aaii-spread,  name: "AAII bull-bear spread",     unit: pts,   aaii: bull_bear_spread }
  - { id: cyc-def,      name: "Cyclicals vs defensives",   unit: ratio, yahoo_ratio: [XLY, XLP] }
  - { id: dax-smi,      name: "DAX vs SMI",                unit: ratio, yahoo_ratio: ["^GDAXI", "^SSMI"] }
  - { id: small-large,  name: "Small vs large (IWM/SPY)",  unit: ratio, yahoo_ratio: [IWM, SPY] }
  - { id: gold-silver,  name: "Gold vs silver",            unit: ratio, yahoo_ratio: ["GC=F", "SI=F"] }
  - { id: spw-spx,      name: "Equal-weight vs SPX",       unit: ratio, yahoo_ratio: [RSP, SPY] }
  # ---- ECON ----
  # DBnomics' ISM mirror grew corrupt tail values (~10) in late 2025; diffusion
  # indices live in ~[25, 75], so clamp to drop garbage without hiding real prints
  - { id: ism-pmi,      name: "ISM Manufacturing PMI",     unit: idx,   dbnomics: "ISM/pmi/pm",    valid_range: [20, 80] }
  - { id: ism-svc,      name: "ISM Services PMI",          unit: idx,   dbnomics: "ISM/nm-pmi/pm", valid_range: [20, 80] }
  - { id: oecd-cli-us,  name: "OECD CLI US",               unit: idx,   oecd: "OECD.SDD.STES,DSD_STES@DF_CLI,4.1/USA.M.LI...AA...H" }
  - { id: oecd-cli-ea,  name: "OECD CLI Europe (G4E)",     unit: idx,   oecd: "OECD.SDD.STES,DSD_STES@DF_CLI,4.1/G4E.M.LI...AA...H" }  # no euro-area aggregate in DF_CLI; G4E = DE/FR/IT/GB
  - { id: claims,       name: "Initial jobless claims",    unit: k,     fred: ICSA }
  - { id: jolts,        name: "Job openings (JOLTS)",      unit: k,     fred: JTSJOL }
  - { id: trucks,       name: "Heavy truck sales",         unit: m,     fred: HTRUCKSSAAR }  # FRED serves millions of units SAAR
  - { id: umich,        name: "UMich consumer sentiment",  unit: idx,   fred: UMCSENT }
  - { id: m2-yoy,       name: "M2 YoY",                    unit: "%",   fred: M2SL, transform: yoy }
  - { id: m2-velocity,  name: "M2 velocity",               unit: ratio, fred: M2V }
  - { id: breakeven-10y,name: "10Y breakeven",             unit: "%",   fred: T10YIE }
  - { id: infl-5y5y,    name: "5y5y fwd inflation",        unit: "%",   fred: T5YIFR }
  - { id: real-10y,     name: "10Y real rate (TIPS)",      unit: "%",   fred: DFII10 }
  - { id: usd-broad,    name: "USD broad index",           unit: idx,   fred: DTWEXBGS }
  # ---- CREDIT ----
  - { id: t10y3m,       name: "US 10Y-3M curve",           unit: "%",   fred: T10Y3M }
  - { id: t10y2y,       name: "US 10Y-2Y curve",           unit: "%",   fred: T10Y2Y }
  - { id: ig-oas,       name: "US IG OAS",                 unit: "%",   fred: BAMLC0A0CM }
  - { id: hy-oas,       name: "US HY OAS",                 unit: "%",   fred: BAMLH0A0HYM2 }
  - { id: eu-hy-oas,    name: "Euro HY OAS",               unit: "%",   fred: BAMLHE00EHYIOAS }
  - { id: bbb-oas,      name: "US BBB OAS",                unit: "%",   fred: BAMLC0A4CBBB }
  - { id: ccc-oas,      name: "US CCC OAS",                unit: "%",   fred: BAMLH0A3HYC }
  - { id: aaa-oas,      name: "US AAA OAS",                unit: "%",   fred: BAMLC0A1CAAA }
  - { id: aa-oas,       name: "US AA OAS",                 unit: "%",   fred: BAMLC0A2CAA }
  - { id: a-oas,        name: "US A OAS",                  unit: "%",   fred: BAMLC0A3CA }
  - { id: bb-oas,       name: "US BB OAS",                 unit: "%",   fred: BAMLH0A1HYBB }
  - { id: b-oas,        name: "US B OAS",                  unit: "%",   fred: BAMLH0A2HYB }
  # ICE BofA US corporate OAS by remaining-maturity bucket (full universe)
  - { id: corp-13y-oas,   name: "US Corp 1-3Y OAS",         unit: "%",   fred: BAMLC1A0C13Y }
  - { id: corp-35y-oas,   name: "US Corp 3-5Y OAS",         unit: "%",   fred: BAMLC2A0C35Y }
  - { id: corp-57y-oas,   name: "US Corp 5-7Y OAS",         unit: "%",   fred: BAMLC3A0C57Y }
  - { id: corp-710y-oas,  name: "US Corp 7-10Y OAS",        unit: "%",   fred: BAMLC4A0C710Y }
  - { id: corp-1015y-oas, name: "US Corp 10-15Y OAS",       unit: "%",   fred: BAMLC7A0C1015Y }
  - { id: corp-15py-oas,  name: "US Corp 15Y+ OAS",         unit: "%",   fred: BAMLC8A0C15PY }
  - { id: nfci,         name: "Chicago Fed NFCI",          unit: idx,   fred: NFCI }
  - { id: bank-lending, name: "Bank loans & leases YoY",   unit: "%",   fred: LOANS, transform: yoy }  # monthly; weekly TOTLL never aligns for the yoy transform
  # ---- PROFIT ---- (S&P EPS workbook is Akamai-403'd; FRED CP carries the cycle)
  - { id: corp-profits, name: "Corporate profits YoY",     unit: "%",   fred: CP, transform: yoy }
  # ---- POS ----
  - { id: cot-vix,      name: "VIX net non-commercial",    unit: contracts, cftc: "1170E1" }
  - { id: cot-crude,    name: "Crude net non-commercial",  unit: contracts, cftc: "067651" }
  - { id: cot-usd,      name: "USD idx net non-commercial",unit: contracts, cftc: "098662" }
  - { id: cot-gbp,      name: "GBP net non-commercial",    unit: contracts, cftc: "096742" }
  # ---- QUANT ---- (added 2026-10-03: quant hedge-fund tab)
  # Treasury futures positioning — CFTC legacy COT, net non-commercial (long-short), weekly.
  # NOTE: the cftc fetcher reads the legacy futures-only report; the finer
  # "leveraged funds" split (CFTC Traders in Financial Futures) is NOT reachable
  # via config alone — the free OFR Hedge Fund Monitor API has it
  # (TFF-LF_TREAS_NET_POSITION) but needs a small ofr.py fetcher (code change).
  - { id: cot-ust-2y,   name: "UST 2Y futures net non-commercial",     unit: contracts, cftc: "042601" }
  - { id: cot-ust-5y,   name: "UST 5Y futures net non-commercial",     unit: contracts, cftc: "044601" }
  - { id: cot-ust-10y,  name: "UST 10Y futures net non-commercial",    unit: contracts, cftc: "043602" }
  - { id: cot-ust-30y,  name: "UST 30Y bond futures net non-commercial", unit: contracts, cftc: "020601" }
  # Basis-trade funding leg — FRED, daily
  - { id: sofr,   name: "SOFR (repo funding rate)",     unit: "%",  fred: SOFR }
  - { id: obfr,   name: "Overnight bank funding rate", unit: "%",  fred: OBFR }
  - { id: iorb,   name: "Interest on reserve balances", unit: "%", fred: IORB }
  - { id: rrp-on, name: "ON RRP take-up",               unit: bn,   fred: RRPONTSYD }
  # Duration-flow momentum via ETF price ratios (cycle_series has no plain
  # yahoo: key). Rising TLT/SHY = duration bid; falling = redemptions/shorts.
  # Real ETF flow quantities have no free machine-readable feed fitting the
  # fetchers (stockanalysis/iShares/etfdb all bot-walled) — this is a proxy.
  - { id: tlt-shy, name: "TLT/SHY (long-duration momentum)", unit: ratio, yahoo_ratio: [TLT, SHY] }
  - { id: ief-shy, name: "IEF/SHY (belly momentum)",        unit: ratio, yahoo_ratio: [IEF, SHY] }
  # ---- OFR Hedge Fund Monitor on the QUANT tab ----
  # Mnemonics verified live 2026-10-03 (dataset=fpf, quarterly). Raw values are
  # USD (trillions); unit "$" is honest — charts will show full dollar figures.
  # NOTE: hf-top10-lev duplicates the ofr_series job below under another store
  # key; harmless (one extra quarterly fetch) and keeps the tab self-contained.
  - { id: hf-repo-borrow,   name: "HF repo borrowing $",       unit: "$", ofr: FPF-BORROW_REPO_SUM }
  - { id: hf-treasury-long, name: "HF long UST exposure $",    unit: "$", ofr: FPF-ASSETCLASS_LTREASURY_SUM }
  - { id: hf-top10-lev,     name: "Top-10 HF leverage ratio",  unit: "x", ofr: FPF-ALLQHF_GAVN10_LEVERAGERATIO_AVERAGE }

  # ---- batch 3: single-symbol Yahoo prices (new `yahoo:` field in CycleSeriesCfg) ----
  - { id: mbb-us,   name: "MBB (agency MBS ETF)",        unit: px,  yahoo: MBB }
  - { id: hyg,      name: "HYG (HY credit)",              unit: px,  yahoo: HYG }
  - { id: lqd,      name: "LQD (IG credit)",              unit: px,  yahoo: LQD }
  - { id: gld,      name: "GLD (gold)",                   unit: px,  yahoo: GLD }
  - { id: btc,      name: "BTC-USD",                      unit: px,  yahoo: "BTC-USD" }
  - { id: vix3m,    name: "VIX3M (3M implied vol)",       unit: idx, yahoo: "^VIX3M" }
  # ---- MBS spread proxy (price ratio — NOT a flow) ----
  - { id: mbb-shy,  name: "MBB/SHY (MBS vs short UST)",   unit: ratio, yahoo_ratio: [MBB, SHY] }
  # ---- CBOE put/call ratios (exact names in the daily CDN JSON; verified 2026-10-03) ----
